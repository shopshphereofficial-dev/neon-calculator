name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platforms
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          yes | "$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          yes | "$SDK" "platforms;android-34" > /dev/null 2>&1 || true
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK (for the website download)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Neon-Calculator-v1.4.apk

      - name: Create release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.4 Neon-Calculator-v1.4.apk \
            --title "Neon Calculator v1.4 (API 35)" \
            --notes "compileSdk/targetSdk 35 for Google Play. Debug APK for sideloading on Android 8.0+." \
            || gh release upload v1.4 Neon-Calculator-v1.4.apk --clobber

      - name: Prepare app.apk
        run: cp $(find app/build/outputs/apk -name '*.apk' | head -1) app.apk

      - name: Publish standard app.apk release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          make_latest: true
          files: app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 35 (and 34 as fallback)
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$SDK" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | "$SDK" "platforms;android-34" > /dev/null || true
          fi

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK (for the website download)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Neon-Calculator-v1.4.apk

      - name: Decode upload keystore (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build signed release AAB (only when a keystore is configured)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Keep the AAB
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: cp "$(find app/build/outputs/bundle/release -name '*.aab' | head -1)" Neon-Calculator-v1.4.aab

      - name: Create release with APK (and AAB if built)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="Neon-Calculator-v1.4.apk"
          if [ -f Neon-Calculator-v1.4.aab ]; then FILES="$FILES Neon-Calculator-v1.4.aab"; fi
          gh release create v1.4 $FILES \
            --title "Neon Calculator v1.4 (API 35, Play-ready config)" \
            --notes "targetSdk 35 / compileSdk 35 for Google Play. Debug APK for sideloading on Android 8.0+." \
            || gh release upload v1.4 $FILES --clobber

      - name: Prepare app.apk
        run: cp $(find app/build/outputs/apk -name '*.apk' | head -1) app.apk

      - name: Publish standard app.apk release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          make_latest: true
          files: app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
